base_url = "https://jtcortex.github.io"
title = "Cortex Research"
description = "A clean technical blog"
default_language = "en"
compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]
taxonomies = [
  { name = "categories", feed = true },
  { name = "tags", feed = true },
]
theme = "roadcore"

[markdown]
render_emoji = true
external_links_target_blank = true
smart_punctuation = true
github_alerts = true

[markdown.highlighting]
theme = "catppuccin-mocha"
style = "inline"

[extra]
author = "JT Corcoran"
tagline = "Cybersecurity and engineering, that's pretty much it."
highlight_color = "#a6e3a1"
sidebar = "right"
menu = [
  { name = "Home", url = "/", weight = 1 },
  { name = "Posts", url = "/posts/", weight = 2 },
  { name = "Projects", url = "/projects/", weight = 3 },
  { name = "About", url = "/about/", weight = 4 },
]
social = [
  { name = "GitHub", url = "https://github.com/USERNAME" },
  { name = "RSS", url = "/atom.xml" },
]
widgets = ["search", "recent", "tags"]
footer_text = ""
github_pages = true
