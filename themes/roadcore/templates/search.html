{% extends "base.html" %}

{% block title %}Search · {{ config.title }}{% endblock title %}

{% block content %}
<header class="main__header">
  <h1 class="main__title">Search</h1>
</header>
<form class="widget-search__form" id="search-form" role="search" style="margin-bottom: 1.5rem;">
  <input class="widget-search__field" id="search-q" type="search" placeholder="Search…" autofocus>
</form>
<div id="search-status" class="meta"></div>
<ul class="search-results" id="search-results"></ul>
{% endblock content %}

{% block scripts %}
<script src="{{ get_url(path='elasticlunr.min.js') }}"></script>
<script src="{{ get_url(path='search_index.en.js') }}"></script>
<script src="{{ get_url(path='js/search.js') }}"></script>
{% endblock scripts %}
