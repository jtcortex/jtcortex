<div class="logo">
  <a class="logo__link" href="{{ get_url(path='') }}" title="{{ config.title }}">
    <div class="logo__text">
      <p class="logo__title">{{ config.title }}</p>
      {% if config.extra.tagline %}
      <span class="logo__tagline">{{ config.extra.tagline }}</span>
      {% endif %}
    </div>
  </a>
</div>
<hr class="divider">
